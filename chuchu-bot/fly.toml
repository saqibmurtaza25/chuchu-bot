# Fly.io config — the BEST free option for a 24/7 bot because Fly's free
# machines run continuously (they do not sleep like Render free tier).
# Setup: install flyctl, run `flyctl launch` (it will use this file), then `flyctl deploy`.
app = "chuchu-bot"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[[services]]
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls"]
    port = 443

  [[services.tcp_checks]]
    interval = 15000
    timeout = 3000
    grace_period = "15s"
