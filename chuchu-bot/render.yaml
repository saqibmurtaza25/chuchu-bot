# Render Blueprint — deploy the backend by pushing this repo to GitHub.
# NOTE: Render's FREE web service sleeps after ~15 min of inactivity.
# For a bot that must stream data 24/7 use a paid plan (or Railway/Fly.io/Oracle free tier).
services:
  - type: web
    name: chuchu-bot-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
